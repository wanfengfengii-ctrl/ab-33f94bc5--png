services:
  api:
    build: .
    environment:
      PORT: 8000
    ports:
      # Host-side port is configurable: PNG_AUDIT_PORT=9000 docker compose up api
      - "${PNG_AUDIT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
    command: ["python", "scripts/verify.py"]
